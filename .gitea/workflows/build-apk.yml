name: Compilar APK do OBD-Droid

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar o repositório e subrepositórios
        uses: actions/checkout@v4
        with:
          submodules: recursive # Essencial, pois o OBD-Droid puxa o banco de dados de falhas (DTCs) de outros repositórios

      - name: Configurar o Java (Requisito do Android Studio)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Dar permissão de execução ao Gradle
        run: chmod +x gradlew
        
      - name: Compilar o APK
        run: ./gradlew :app:assembleDebug
        
      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Droid-APK
          path: app/build/outputs/apk/debug/app-debug.apk
