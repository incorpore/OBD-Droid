pluginManagement {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}
include ':app'

// NHTSA VIN Decoder modules
include ':nhtsa-vin-decoder-java'
project(':nhtsa-vin-decoder-java').projectDir = new File(rootDir, 'modules/nhtsa-vin-decoder')
include ':nhtsa-vin-decoder-android'
project(':nhtsa-vin-decoder-android').projectDir = new File(rootDir, 'modules/nhtsa-vin-decoder/android/nhtsa-vin-decoder-android')

// Automotive Logo Library
include ':automotive-logo-library-android'
project(':automotive-logo-library-android').projectDir = new File(rootDir, 'modules/automotive-logo-library/android/automotive-logo-library-android')

