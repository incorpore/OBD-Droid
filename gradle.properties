android.nonFinalResIds=false
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.unsafe.configuration-cache=true

# JVM settings for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# AutoCheck API configuration (Vehicle History feature)
# This feature requires a private AutoCheck backend that you host yourself.
# Override these in local.properties (gitignored) with your own values.
# See README.md for details.
AUTOCHECK_API_BASE_URL=
AUTOCHECK_API_KEY=